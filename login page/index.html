<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

<div class="box">

<h1>Registration</h1>

<h2>Personal Details</h2>

<form action="login.html">

<label>Full Name</label><br>
<input type="text" placeholder="Enter your name">

<label>Date of Birth</label><br>
<input type="date">

<label>Email</label><br>
<input type="email" placeholder="Enter your email">

<label>Mobile Number</label><br>
<input type="text" placeholder="Enter mobile number">

<label>Gender</label><br>
<input type="text" placeholder="Enter gender">

<label>Occupation</label><br>
<input type="text" placeholder="Enter occupation">

<h2>Identity Details</h2>

<label>ID Type</label><br>
<input type="text" placeholder="Enter ID type">

<label>ID Number</label><br>
<input type="text" placeholder="Enter ID Number">

<label>Issue Authority</label><br>
<input type="text" placeholder="Enter Authority">

<label>Issue Date</label><br>
<input type="date">

<label>Issue State</label><br>
<input type="text" placeholder="Enter State">

<label>Expiry Date</label><br>
<input type="date">

<br><br>

<button>Next</button>

</form>

</div>

</body>
</html>
