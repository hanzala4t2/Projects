<html>
<head>
    <title>Login</title>
</head>
<body>
    <fieldset>
        <legend>Your Details</legend>
        <p>Username:
            <input type="text" name="Username">
        </p>
        <p>Mail:
            <input type="email" name="email">
        </p>

         <p>
            Password:
            <input type="password" name="password" >
        </p>
    </fieldset>
    <fieldset>
        <legend>Review</legend>
        <p>Select your gender:</p>
        <p>Male
        <input type="radio" >
        Female
        <input type="radio">
        Other
            <input type="radio">
        </p>
        <p>Feedback</p>
            <textarea name="Feedback" placeholder="Enter your Comment:" cols="25" rows="4"></textarea>

        <p>What do you think is best?
        <select name="account">
            <option value="gmail">Gmail</option>
            <option value="Yahoo">Yahoo</option>
        </select>
        </p>
        <p>
            <input type="checkbox"/>Sign me up for upcoming updates.</p>
            <button>Submit</button>
    </fieldset>
</body>
</html>
